<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Media Interaktif Etnomatematika - Challenge-Based Learning Benteng Fort Willem I">
    <title>Peta Konsep — FORTIFY</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Grandstander:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    
    <!-- Alpine.js untuk interaksi zoom-in -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'heading': ['Grandstander', 'ui-sans-serif', 'system-ui'],
                        'sans': ['Grandstander', 'ui-sans-serif', 'system-ui'],
                    },
                    colors: {
                        'primary': '#7B3F00',
                        'primary-dark': '#5C2E00',
                        'gold': '#D4A017',
                        'gold-light': '#F5D060',
                        'gold-dark': '#B8860B',
                        'cream': '#FDF8F0',
                        'cream-dark': '#F5EDE0',
                        'sidebar': '#1C1108',
                        'accent': '#2E7D32',
                        'text-main': '#1A1A1A',
                        'text-light': '#6B5B4F',
                        'text-muted': '#9B8B7F',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: var(--color-cream-dark); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--color-gold); border-radius: 10px; }
    </style>
</head>
<body class="bg-cream min-h-screen">

    <!-- Top Navigation Bar -->
            <header class="fixed top-0 left-0 right-0 z-50 text-white shadow-lg border-b border-gold/20" style="background-color: #1C1108;">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="menu.html" style="display:flex; align-items:center; justify-content:center; width:34px; height:34px; color:#D4A017; text-decoration:none; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
                    <svg style="width:22px;height:22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <span style="font-family: 'Anton', sans-serif; font-size:20px; font-weight:normal; letter-spacing: 1px; color:#D4A017; margin:0; line-height:1.2; padding-top: 3px;">PETA KONSEP</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-16 min-h-screen">
        <div class="p-6 lg:p-10 max-w-5xl mx-auto">

            <!-- Page Header -->
            <div class="mb-8 animate-fade-in-up">
                <h1 class="font-heading font-bold text-3xl lg:text-4xl text-primary-dark mb-2">Peta Konsep Pembelajaran</h1>
                <p class="text-text-light">Alur pembelajaran materi Volume & Luas Permukaan Kubus dan Balok berbasis Etnomatematika Benteng Fort Willem I</p>
            </div>

            <!-- Peta Konsep - Full Vertical, No Scroll -->
            <div class="card-heritage mb-8">
                <div class="bg-cream-dark rounded-xl p-6 md:p-10">

                    <!-- Visual Concept Map: Full Vertical -->
                    <div class="flex flex-col items-center gap-0 w-full max-w-2xl mx-auto">

                        <!-- Top Level -->
                        <div class="w-full flex justify-center">
                            <div class="bg-heritage-gradient text-white px-6 py-3 rounded-xl font-heading font-bold text-center shadow-lg text-sm md:text-base">
                                Bangun Ruang Sisi Datar
                            </div>
                        </div>

                        <!-- Connector down -->
                        <div class="w-[2px] h-6 bg-gold"></div>

                        <!-- Branch row: Kubus & Balok side by side -->
                        <div class="w-full flex relative">
                            <!-- Left Branch (Kubus) -->
                            <div class="flex-1 flex flex-col">
                                <!-- Connecting lines -->
                                <div class="w-full flex justify-end">
                                    <div class="w-1/2 h-6 border-t-2 border-l-2 border-gold rounded-tl"></div>
                                </div>
                                <div class="px-2 md:px-5 flex flex-col items-center gap-0">
                                    <div class="bg-primary text-white px-4 py-2.5 rounded-xl font-heading font-semibold text-center shadow-md text-sm w-full">
                                        KUBUS
                                    </div>
                                    <div class="w-[2px] h-6 bg-gold/50"></div>
                                    <div class="bg-white border border-gold/20 px-3 py-2 rounded-lg text-xs md:text-sm text-center shadow-sm w-full">
                                        📐 Volume
                                    </div>
                                    <div class="w-[2px] h-4 bg-gold/30"></div>
                                    <div class="bg-white border border-gold/20 px-3 py-2 rounded-lg text-xs md:text-sm text-center shadow-sm w-full">
                                        🟦 Luas Permukaan
                                    </div>
                                </div>
                            </div>

                            <!-- Right Branch (Balok) -->
                            <div class="flex-1 flex flex-col">
                                <!-- Connecting lines -->
                                <div class="w-full flex justify-start">
                                    <div class="w-1/2 h-6 border-t-2 border-r-2 border-gold rounded-tr"></div>
                                </div>
                                <div class="px-2 md:px-5 flex flex-col items-center gap-0">
                                    <div class="bg-primary text-white px-4 py-2.5 rounded-xl font-heading font-semibold text-center shadow-md text-sm w-full">
                                        BALOK
                                    </div>
                                    <div class="w-[2px] h-6 bg-gold/50"></div>
                                    <div class="bg-white border border-gold/20 px-3 py-2 rounded-lg text-xs md:text-sm text-center shadow-sm w-full">
                                        📐 Volume
                                    </div>
                                    <div class="w-[2px] h-4 bg-gold/30"></div>
                                    <div class="bg-white border border-gold/20 px-3 py-2 rounded-lg text-xs md:text-sm text-center shadow-sm w-full">
                                        🟦 Luas Permukaan
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>
<script src="assets/js/app.js"></script>
</body>
</html>
